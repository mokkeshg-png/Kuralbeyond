project_id = "kuralbeyond"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://127.0.0.1:5173", "http://localhost:5173"]
jwt_expiry = 604800 # 7 days per PRD Section 60
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false # Relaxed for local dev/demo per PRD Section 60

[storage]
enabled = true
file_size_limit = "50MiB"

[functions]
[functions.tts-generate-batch]
verify_jwt = true

[functions.tts-get]
verify_jwt = true

[functions.admin-review-audio]
verify_jwt = true

[functions.stt-transcribe]
verify_jwt = true

[functions.parent-consent-request]
verify_jwt = false

[functions.parent-consent-confirm]
verify_jwt = false

[functions.delete-account]
verify_jwt = true

[functions.export-my-data]
verify_jwt = true

[functions.cleanup-recordings]
verify_jwt = false

[functions.weekly-parent-summary]
verify_jwt = true
